seed: 16
num_steps_per_env: 24
max_iterations: 13001
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
  teacher: !!python/tuple
  - teacher
  - camera
save_interval: 1000
experiment_name: g1_blind_rough_teacherkl
run_name: ''
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
  class_name: PPOTeacherKL
  teacher_kl_cfg:
    enabled: true
    imitation_only: true
    imitation_loss_coef: 1.0
    checkpoint_path: logs/rsl_rl/g1_velocity_target_heading_teacher_depth/Mjlab-Velocity-TargetHeading-Rough-Teacher-Unitree-G1/2026-05-21_11-54-52_rollback_29750/model_118200.pt
    loss_type: mean_huber
    lambda_start: 0.03
    lambda_end: 0.0
    warmup_iters: 1000
    constant_iters: 0
    anneal_iters: 10000
    schedule: cosine
    huber_delta: 0.5
    max_teacher_loss: null
    max_kl_loss: null
    max_kl_loss_tail_slope: 0.0
    check_shapes: true
    fail_on_nonfinite_kl: true
    debug_shapes: false
teacher:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg:
    output_channels:
    - 16
    - 32
    kernel_size:
    - 5
    - 3
    stride:
    - 2
    - 2
    padding: zeros
    activation: elu
    max_pool: false
    global_pool: none
    spatial_softmax: true
    spatial_softmax_temperature: 1.0
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: mjlab.rl.spatial_softmax:SpatialSoftmaxCNNModel
